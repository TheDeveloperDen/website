name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release & trigger deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://developerden.org
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache Elm packages
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
          restore-keys: elm-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build Tailwind modules
        run: bun run tw

      - name: Build
        run: bun run build

      - name: Package
        run: tar -czf website-dist.tar.gz -C dist .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" website-dist.tar.gz \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Trigger deploy
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          sig=$(printf '{}' | openssl dgst -sha256 -hmac "$SECRET" | sed 's/.* //')
          curl -fsS -X POST -H "X-Hub-Signature-256: sha256=$sig" -d '{}' https://hooks.developerden.org/hooks/website
